name: Thursday picks

# Thursday afternoon, before the week's first kickoff.
#
#   21:00 UTC = 17:00 ET while daylight saving is on, 16:00 ET after it ends.
#
# Deliberately late in the day rather than at noon. The pool's lines are fixed
# once posted; the market keeps moving all week, and the edge is the gap
# between them — so every extra hour of market movement we capture is a
# slightly sharper pick. Thursday night kickoff is 20:15 ET, which leaves about
# three hours of slack for GitHub to start a scheduled run late, as it often
# does under load.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 4"

permissions:
  contents: write
  issues: write

concurrency:
  group: thursday-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh schedule, results and market lines
        run: python scripts/fetch_data.py

      # Allowed to fail: the underdog rule only needs the market line, so a
      # broken scrape should cost the line-edge comparison, not all sixteen
      # picks. The job is failed deliberately at the end so the failure still
      # gets reported.
      - name: Capture the pool's lines
        id: capture
        continue-on-error: true
        env:
          POOLHOST_URL: ${{ secrets.POOLHOST_URL }}
          POOLHOST_USERNAME: ${{ secrets.POOLHOST_USERNAME }}
          POOLHOST_PASSWORD: ${{ secrets.POOLHOST_PASSWORD }}
        run: python scripts/pool_lines.py --live

      - name: Make the picks
        run: |
          python scripts/make_picks.py --save --csv picks.csv --markdown picks.md | tee picks.txt

      - uses: actions/upload-artifact@v4
        with:
          name: picks
          path: |
            picks.csv
            picks.txt
            picks.md

      - name: Commit the captured sheet and the picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/pool data/picks
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Pool lines and picks: week captured automatically"
            git push
          fi

      # Delivery. GitHub emails the owner when an issue mentioning them is
      # opened, so this gets the picks into an inbox without any mail
      # credentials. Runs even when the scrape failed, since the underdog-rule
      # picks are still worth having — the body says so in that case.
      - name: Send the picks
        if: always() && hashFiles('picks.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title=$(head -1 picks.md | sed 's/^#[[:space:]]*//')
          {
            tail -n +2 picks.md
            printf '\n---\n\n'
            printf '@%s — `picks.csv` is attached to [this run](%s).\n' "$OWNER" "$RUN_URL"
            printf '\nClose this issue once the picks are in.\n'
          } > issue.md
          gh issue create --title "$title" --body-file issue.md

      # Picks are made and uploaded by now, but a failed scrape still needs to
      # be visible — otherwise the line edges quietly stop appearing and the
      # run goes on looking green.
      - name: Report a failed scrape
        if: steps.capture.outcome == 'failure'
        run: |
          echo "::error::Pool scrape failed — picks were made from market lines only."
          echo "The log above says which page was served; see scripts/pool_lines.py."
          exit 1
